  };
  if(busy&&!d)return h(Loading,{label:"Opening the outbox"});
  if(err)return h(Err,{msg:err});
  if(!d)return null;

  const del=d.delivery||{}, asst=d.assistant||{}, st=d.stats||{};
  const rows=(d.alerts||[]).filter(a=>!filter||a.kind===filter);

  return h("div",{className:"space-y-4"},
    h("div",{className:"grid grid-cols-2 md:grid-cols-4 gap-3"},
      h(Kpi,{label:"Alerts raised",value:st.n_alerts||0,tone:"cyan",
        hint:"Every alert this app has produced. Kept across re-seeding, because the record of what the team was told is about the app's behaviour, not about which log is loaded."}),
      h(Kpi,{label:"Action required",value:(st.by_kind||{}).alert||0,tone:"rose",sub:"hardware",
        hint:"Hardware faults. A script cannot fix these, so a human is paged."}),
      h(Kpi,{label:"Notifications",value:(st.by_kind||{}).notice||0,tone:"cyan",sub:"software",
        hint:"Software faults. Scripted remediation is attempted automatically; the team is told so they know it is happening."}),
      h(Kpi,{label:"Delivery",value:del.mode==="live"?"Live":"Simulated",
        tone:del.mode==="live"?"teal":"sky",
        sub:del.mode==="live"?del.smtp_host:"no SMTP configured",
        hint:del.detail})),

    h(Panel,{pad:"p-4"},
      h("div",{className:"flex items-start justify-between gap-4 flex-wrap"},
        h("div",{className:"flex-1 min-w-[280px]"},
          h("div",{className:`text-xs leading-relaxed ${
            del.mode==="live"?"text-cyan-100/90":"text-violet-100/90"}`},
            h("strong",null,del.mode==="live"
              ? "Alerts are being emailed. " : "Alerts are being recorded, not sent. "),
            del.detail),
          h("div",{className:"text-[11px] text-slate-400 mt-2"},
            "Recipients: ",
            h("code",{className:"text-slate-200"},(del.recipients||[]).join(", ")),
            h("span",{className:"text-slate-600"}," · "),
            "one alert per router every ",del.cooldown_minutes," minutes"),
          h("div",{className:"text-[11px] mt-2 pt-2 border-t border-cyan-500/10 "+
              (asst.engine==="llm"?"text-slate-400":"text-violet-200/80")},
            h("strong",null,"Assistant: "),
            asst.engine==="llm"?`answers written by ${asst.model}. `:"offline engine. ",
            asst.detail,
            asst.last_error&&h("span",{className:"block font-mono text-rose-300 mt-1 break-all"},
              asst.last_error))),
        h(Btn,{size:"sm",variant:"ghost",onClick:runTest,disabled:testing},
          testing?"Sending…":"Send a test email")),
      test&&h("div",{className:"mt-3"},
        test.status==="sent"
          ? h("div",{className:"rounded-xl border border-teal-500/35 bg-teal-500/[.07] p-3"},
              h("div",{className:"text-sm text-teal-100"},"Test message delivered."),
              h("div",{className:"text-[11px] text-slate-300 mt-1"},test.detail))
          : test.status==="simulated"
            ? h(Note,{tone:"violet"},h("strong",null,"Nothing was transmitted. "),test.detail)
            : h("div",{className:"rounded-xl border border-rose-500/40 bg-rose-500/[.07] p-3"},
                h("div",{className:"text-sm text-rose-100"},"The mail server rejected it."),
                h("div",{className:"text-[11px] text-slate-300 mt-1 font-mono break-all"},
                  test.error||test.detail),
                h("div",{className:"text-[11px] text-slate-400 mt-2 leading-relaxed"},
                  "If this mentions ",h("code",null,"Username and Password not accepted"),
                  ", the account password was used instead of a Google App Password. ",
                  "Gmail stopped accepting account passwords in May 2025 — enable ",
                  "2-Step Verification, generate an App Password for Mail, and put those ",
                  "16 characters in ",h("code",null,"backend/.env"),".")))),

    h("div",{className:"grid lg:grid-cols-[22rem_1fr] gap-4 items-start"},
      h(Panel,{title:"Outbox",
        subtitle:`${rows.length} of ${st.n_alerts||0} shown`,
        right:h(Btn,{size:"sm",variant:"ghost",onClick:load},"Refresh")},
        h("div",{className:"flex gap-1 mb-3"},
          [["","All"],["alert","Action"],["notice","Notices"]].map(([k,l])=>
            h("button",{key:k||"all",onClick:()=>setFilter(k),
              className:`px-2.5 py-1 text-[11px] rounded-lg border ${
                filter===k?"border-cyan-400/50 bg-cyan-500/15 text-cyan-200"
                          :"border-cyan-500/15 text-slate-400 hover:text-slate-200"}`},l))),
        rows.length===0
          ? h("p",{className:"text-[12px] text-slate-500 py-6 text-center leading-relaxed"},
              "No alerts yet. Open the Fleet tab — any router above the alert threshold raises one automatically.")
          : h("div",{className:"space-y-1.5 max-h-[36rem] overflow-auto pr-1"},
              rows.map(a=>h("button",{key:a.id,onClick:()=>setSel(a.id),
                className:`w-full text-left rounded-xl border px-3 py-2.5 transition-colors ${
                  sel===a.id?"border-cyan-400/50 bg-cyan-500/10"
                            :"border-cyan-500/12 bg-black/25 hover:bg-cyan-500/[.05]"}`},
                h("div",{className:"flex items-center gap-2"},
                  h("span",{className:"w-1.5 h-1.5 rounded-full shrink-0",
                    style:{background:a.kind==="alert"?BAND.critical.c:SW_COLOR}}),
                  h("span",{className:"font-mono text-[12px] text-white"},a.device_id),
                  h("span",{className:"text-[11px] font-mono ml-auto",
                    style:{color:a.kind==="alert"?BAND.critical.c:SW_COLOR}},pc(a.fault_probability))),
                h("div",{className:"text-[10px] text-slate-500 mt-1 flex items-center gap-1.5 flex-wrap"},
                  h("span",null,fmtDateTime(a.created_at)),
                  h("span",{className:"text-slate-700"},"·"),
                  h("span",null,a.site||"—"),
                  a.n_messages>0&&h("span",{className:"text-cyan-400"},
                    `· ${a.n_messages} message${a.n_messages===1?"":"s"}`)))))),
      h(AlertDetail,{alertId:sel,
        defaultView:(sel===initialAlertId&&initialView==="chat")?"chat":"email"})));
}

// ------------------------------------------------- comparison context
function CompareContext({c}){
  if(!c)return null;
  const A=c.a,B=c.b;
  const explained=(c.factors||[]).filter(f=>f.explains);

  // Two sites on a small map. Same site collapses to a single marker.
  const map=(function(){
    const pts=[A,B].filter(p=>p.lat!=null&&p.lon!=null);
    if(pts.length<2)return null;
    const W=560,H=190,P=42;
    const las=pts.map(p=>p.lat),los=pts.map(p=>p.lon);
    const la0=Math.min(...las),la1=Math.max(...las),lo0=Math.min(...los),lo1=Math.max(...los);
    const X=lo=>(lo1-lo0)<1e-9?W/2:P+((lo-lo0)/(lo1-lo0))*(W-2*P);
    const Y=la=>(la1-la0)<1e-9?H/2:H-P-((la-la0)/(la1-la0))*(H-2*P);
    const ax=X(A.lon),ay=Y(A.lat),bx=X(B.lon),by=Y(B.lat);
    const dot=(p,x,y,col)=>h("g",{key:p.device_id,transform:`translate(${x},${y})`},
      h("circle",{r:16,fill:col,fillOpacity:.12}),
      h("circle",{r:6,fill:col,fillOpacity:.35,stroke:col,strokeWidth:2}),
      h("text",{y:-14,textAnchor:"middle",style:{fontSize:10,fill:"#e2e8f0",fontWeight:600}},p.device_id),
      h("text",{y:24,textAnchor:"middle",style:{fontSize:9.5,fill:"#94a3b8"}},p.site||"unknown"),
      p.site_pressure&&p.site_pressure.known_stressed&&h("text",{y:36,textAnchor:"middle",
        style:{fontSize:8.5,fill:BAND.elevated.c}},"known problem site"));
    return h("svg",{viewBox:`0 0 ${W} ${H}`,className:"w-full"},
      c.same_site
        ? null
        : h("g",null,
            h("line",{x1:ax,y1:ay,x2:bx,y2:by,stroke:"#1e3a5f",strokeWidth:1.4,strokeDasharray:"5 4"}),
            c.distance_km!=null&&h("text",{x:(ax+bx)/2,y:(ay+by)/2-7,textAnchor:"middle",
              style:{fontSize:10,fill:"#7c93ad"}},`${c.distance_km} km apart`)),
      dot(A,ax,ay,"#f43f5e"),dot(B,bx,by,"#2dd4bf"));
  })();

  const statRow=(label,va,vb,hint)=>h("tr",{key:label,className:"border-t border-cyan-500/[.07]"},
    h("td",{className:"py-1.5 pr-3 text-slate-400 text-[11px]"},label,
      hint&&h("div",{className:"text-[9.5px] text-slate-600"},hint)),
    h("td",{className:"py-1.5 px-2 text-right font-mono text-[11px] text-rose-200"},va),
    h("td",{className:"py-1.5 pl-2 text-right font-mono text-[11px] text-teal-200"},vb));

  return h("div",{className:"space-y-4"},
    h(Panel,{title:"What else is different about these two routers",
      subtitle:"The score says which one is riskier. This says why it might be — location, physical environment, hardware vintage, position in the topology and track record. Anything marked as explaining the gap is a candidate cause worth checking before you touch the device."},
      explained.length===0
        ? h(Note,{tone:"violet"},
            h("strong",null,"None of these dimensions explains the gap. "),
            "Same site or comparable sites, similar environment, similar record. That points back at what the two routers are doing right now — compare their alarm patterns in the Inspector.")
        : h(Note,null,
            h("strong",null,`${explained.length} candidate cause${explained.length===1?"":"s"} found: `),
            explained.map(f=>f.dimension.toLowerCase()).join(", "),"."),
      map&&h("div",{className:"mt-4 rounded-xl bg-[#050d18] grid-bg overflow-hidden"},map),
      h("div",{className:"mt-4 space-y-2.5"},
        (c.factors||[]).map((f,i)=>h("div",{key:i,
            className:"rounded-xl border px-3.5 py-3 "+(f.explains
              ? "border-purple-500/30 bg-purple-500/[.06]"
              : "border-cyan-500/12 bg-black/25")},
          h("div",{className:"flex items-center gap-2 flex-wrap"},
            h("span",{className:"text-[9px] uppercase tracking-wider px-1.5 py-0.5 rounded border "+
              (f.explains?"text-purple-200 border-purple-500/40 bg-purple-500/15"
                         :"text-slate-500 border-slate-600/40")},
              f.explains?"candidate cause":"ruled out"),
            h("span",{className:"text-[11px] uppercase tracking-wider text-slate-500"},f.dimension)),
          h("div",{className:"text-[12.5px] text-white font-medium mt-1.5"},f.headline),
          h("p",{className:"text-[11.5px] text-slate-400 mt-1 leading-relaxed"},f.detail))))),

    h(Panel,{title:"Side by side"},
      h("table",{className:"w-full"},
        h("thead",null,h("tr",null,
          h("th",{className:"text-left text-[10px] uppercase tracking-wider text-slate-500 pb-1"},""),
          h("th",{className:"text-right text-[11px] font-mono text-rose-200 pb-1"},A.device_id),
          h("th",{className:"text-right text-[11px] font-mono text-teal-200 pb-1"},B.device_id))),
        h("tbody",null,
          statRow("Site",A.site||"—",B.site||"—"),
          statRow("Model",A.model||"—",B.model||"—"),
          statRow("Role",A.device_role||"—",B.device_role||"—"),
          statRow("Days of history",A.in_service_days??"—",B.in_service_days??"—",
                  "from first alarm seen"),
          statRow("Environmental / 30d",A.environmental_per_30d??"—",B.environmental_per_30d??"—",
                  "temperature, fans, power"),
          statRow("Equipment / 30d",A.equipment_per_30d??"—",B.equipment_per_30d??"—",
                  "boards, optics, physical parts"),
          statRow("Total alarms",A.n_alarms??"—",B.n_alarms??"—"),
          statRow("Fault episodes",A.n_faults??"—",B.n_faults??"—"),
          statRow("Upstream parent",A.parent_id||"none (core)",B.parent_id||"none (core)"),
          statRow("Downstream devices",A.n_downstream??"—",B.n_downstream??"—"),
          statRow("Routers at risk on site",
                  `${A.site_pressure?.n_at_risk??"—"} / ${A.site_pressure?.n_routers??"—"}`,
                  `${B.site_pressure?.n_at_risk??"—"} / ${B.site_pressure?.n_routers??"—"}`,
                  "a whole site in trouble is a different work order")))));
}

// ---------------------------------------------------------------- APP
// Every alert email links back to its own conversation, as
// /?alert=<id>&view=chat. Reading it here is what makes that link land on the
// right incident with the assistant already open, rather than on the home page.
function deepLink(){
  try{
    const p=new URLSearchParams(window.location.search||"");
    const id=parseInt(p.get("alert"),10);
    return {alertId:Number.isFinite(id)?id:null,view:p.get("view")||null};
  }catch{ return {alertId:null,view:null}; }
}

function App(){
  const link=useMemo(deepLink,[]);
  const [tab,setTab]=useState(link.alertId?"alerts":"overview");
  const [health,setHealth]=useState(null),[topo,setTopo]=useState(null),[fleet,setFleet]=useState(null);
  const [routers,setRouters]=useState([]),[selected,setSelected]=useState("");
  const [moments,setMoments]=useState([]);
  const [loading,setLoading]=useState(true),[metrics,setMetrics]=useState(null);

  const refreshHealth=useCallback(async()=>{
    try{const hh=await j("/health");setHealth(hh);return hh;}
    catch{setHealth({status:"unreachable",models_loaded:false,data_loaded:false});return null;}
  },[]);
  // Data loads regardless of model state — only the risk numbers need the model.
  const loadAll=useCallback(async()=>{
    setLoading(true);
    try{
      const t=await j("/topology"); setTopo(t);
      setRouters((await j("/devices?routers_only=true")).devices||[]);
      try{ setFleet(await j("/fleet")); }catch{ setFleet(null); }
      try{ setMoments((await j("/moments?limit=8")).moments||[]); }catch{ setMoments([]); }
    }catch(e){ setTopo(null); setFleet(null); setRouters([]); setMoments([]); }
    finally{ setLoading(false); }
  },[]);
  useEffect(()=>{(async()=>{
    const hh=await refreshHealth();
    j("/metrics").then(setMetrics).catch(()=>{});
    if(hh?.data_loaded) await loadAll(); else setLoading(false);
  })();},[]);

  const open=id=>{setSelected(id);setTab("router");};
  const modelsLoaded=!!health?.models_loaded;
  const TABS=[["overview","Overview"],["fleet","Fleet"],["router","Inspector"],
              ["compare","Comparison"],["alerts","Alerts"],["data","Data"]];

  const noData=health&&!health.data_loaded;
  return h("div",{className:"min-h-screen"},
    h("header",{className:"sticky top-0 z-30 border-b border-cyan-500/15 bg-[#050c17]/85 backdrop-blur-xl"},
      h("div",{className:"max-w-[1500px] mx-auto px-6 py-3 flex items-center justify-between gap-4 flex-wrap"},
        h("div",{className:"flex items-center gap-3"},
          h(Logo,{size:40}),
          h("div",null,
            h("h1",{className:"text-[17px] font-bold text-white tracking-tight leading-tight"},
              "Router",h("span",{className:"text-cyan-400"},"Guardian")),
            h("p",{className:"text-[10px] text-slate-500 tracking-wide uppercase"},"Network Operations Intelligence"))),
        h("div",{className:"flex items-center gap-4 text-[11px]"},
          h("div",{className:"flex items-center gap-1.5"},
            h("span",{className:`w-1.5 h-1.5 rounded-full ${modelsLoaded?"bg-teal-400":"bg-rose-400"} ${modelsLoaded?"blip":""}`}),
            h("span",{className:"text-slate-400"},modelsLoaded?"model online":"model offline")),
          health?.horizon_hours&&h("div",{className:"text-slate-500 hidden lg:block",
              title:"The model reads the last 24 hours of alarms and predicts whether a fault will occur in the following 12 hours. This is fixed by how the model was trained."},
            h("span",{className:"font-mono text-slate-400"},
              `${health.lookback_hours}h → ${health.horizon_hours}h`)," horizon"),
          health?.n_devices>0&&h("div",{className:"flex items-center gap-1.5 text-slate-500"},
            h("span",{className:"w-1.5 h-1.5 rounded-full bg-cyan-400 blip"}),
            h("span",null,health.n_routers," routers · ",health.n_devices," devices")),
          health?.reference_time&&h("div",{className:"text-slate-600 hidden md:block"},
            "as of ",h("span",{className:"text-slate-400 font-mono"},health.reference_time.slice(0,10)))))),
    h("nav",{className:"max-w-[1500px] mx-auto px-6 pt-5"},
      h("div",{className:"flex gap-1 border-b border-cyan-500/12 flex-wrap"},
        TABS.map(([k,l])=>h("button",{key:k,onClick:()=>setTab(k),
          className:"px-4 py-2.5 text-sm font-medium border-b-2 -mb-px transition-all flex items-center gap-2 "+
            (tab===k?"border-cyan-400 text-white":"border-transparent text-slate-500 hover:text-slate-300")},
          l,
          k==="alerts"&&health?.n_alerts>0&&h("span",{
            className:"text-[10px] font-mono px-1.5 py-0.5 rounded-full bg-rose-500/20 text-rose-300 border border-rose-500/35"},
            health.n_alerts))))),
    h("main",{className:"max-w-[1500px] mx-auto px-6 py-6 space-y-5"},
      noData&&tab!=="data"&&h(Panel,null,h(Empty,{title:"No network loaded",
        body:"Import your alarm-log CSV, or generate a demo network to explore the app right away.",
        action:h(Btn,{onClick:()=>setTab("data")},"Go to Data")})),
      (!noData||tab==="data")&&h(React.Fragment,null,
        tab==="overview"&&h(Overview,{topo,fleet,loading,onSelect:open,reload:loadAll,modelsLoaded}),
        tab==="fleet"&&h(FleetTab,{fleet,moments,loading,onSelect:open,reload:loadAll,modelsLoaded}),
        tab==="router"&&h(RouterTab,{devices:routers,selected,setSelected}),
        tab==="compare"&&h(CompareTab,{devices:routers}),
        tab==="alerts"&&h(AlertsTab,{health,
          initialAlertId:link.alertId,initialView:link.view}),
        tab==="data"&&h(DataTab,{health,onSeeded:async()=>{await refreshHealth();await loadAll();}}))),
    h("footer",{className:"max-w-[1500px] mx-auto px-6 py-7 mt-4 border-t border-cyan-500/10"},
      h("p",{className:"text-[11px] text-slate-600 leading-relaxed"},
        metrics?.display?.summary||"Stage 1 ROC-AUC 0.940 · PR-AUC 0.75 · 85% recall at 70% precision. Trained on synthetic logs built from 1,973 real Huawei alarm definitions.")));
}
createRoot(document.getElementById("root")).render(h(App));
</script>
